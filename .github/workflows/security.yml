name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install
          cd mini-services/api-service && bun install
      - name: Audit root dependencies
        run: npm audit --audit-level=high || true
      - name: Audit API service dependencies
        run: cd mini-services/api-service && npm audit --audit-level=high || true
