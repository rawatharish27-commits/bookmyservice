name = "bookmyservice"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./frontend/dist"

# Build command is read from package.json "build" script
# Cloudflare Pages runs: npm ci && npm run build

# Environment variables
[vars]
VITE_API_URL = "https://bookmyservice-api.onrender.com"

# Production environment
[env.production]
[env.production.vars]
VITE_API_URL = "https://bookmyservice-api.onrender.com"

# Preview environment (deploy previews / PRs)
[env.preview]
[env.preview.vars]
VITE_API_URL = "https://bookmyservice-api-staging.onrender.com"
