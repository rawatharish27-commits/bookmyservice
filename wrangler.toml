#:schema node_modules/wrangler/config-schema.json
name = "bookyourservice"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
JWT_SECRET = "bys-dev-secret-key-change-in-production-2024"

# ─── Supabase PostgreSQL ────────────────────────────────────────────────────
# The backend now uses Supabase's PostgREST API over HTTP instead of D1.
#
# Required environment variables (set via Cloudflare Dashboard → Pages → Settings → Environment Variables):
#   SUPABASE_URL        = https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_KEY = eyJ...  (service_role key — bypasses RLS, keep secret!)
#
# Database setup:
#   1. Open Supabase Dashboard → SQL Editor
#   2. Run the migration SQL from: migrations/postgres/setup_complete.sql
#   3. This creates all tables, indexes, seed data, and PostgreSQL functions
