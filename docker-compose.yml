services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bookmyservice-db
    environment:
      POSTGRES_USER: bookmyservice_user
      POSTGRES_PASSWORD: bookmyservice_password
      POSTGRES_DB: bookmyservice
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/0001_init_postgres.sql:/docker-entrypoint-initdb.d/0001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmyservice_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookmyservice-network

  # Backend API Service (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmyservice-api
    environment:
      DATABASE_URL: postgresql://bookmyservice_user:bookmyservice_password@postgres:5432/bookmyservice
      NODE_ENV: development
      JWT_SECRET: bys-dev-secret-key-change-in-production-2024
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bookmyservice-network

  # Frontend (Development Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bookmyservice-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    command: npm run dev -- --host
    networks:
      - bookmyservice-network

volumes:
  postgres_data:
    driver: local

networks:
  bookmyservice-network:
    driver: bridge
